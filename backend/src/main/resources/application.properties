# Pode ser sobrescrito por variáveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexusfood}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O schema é criado/alterado só pelas migrações do Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Pool de conexões enxuto — evita gastar memória à toa num servidor com pouco RAM
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# Defina JWT_SECRET com uma chave longa e secreta em produção (nunca commitar a real)
jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-string-bem-longa-e-secreta-em-producao-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}

# Stripe — nunca commitar valores reais. Chave/segredo ficam só em variáveis de ambiente.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.basico=${STRIPE_PRICE_BASICO:}
stripe.price.profissional=${STRIPE_PRICE_PROFISSIONAL:}
stripe.price.premium=${STRIPE_PRICE_PREMIUM:}

# URL do frontend, para onde a Stripe redireciona após o checkout
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# E-mail (recuperação de senha), via API HTTP do SendGrid. Sem as duas configuradas, o
# envio é só simulado (fica no log).
sendgrid.api-key=${SENDGRID_API_KEY:}
spring.mail.username=${MAIL_USERNAME:}
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Pedidos por minuto que um mesmo IP pode criar pelo cardápio público
app.rate-limit.pedidos-por-minuto=${RATE_LIMIT_PEDIDOS:10}

# Nexus Analytics: regra vigente do score e rotina que fecha o dia de cada restaurante
app.nexus.regra-vigente=v1
app.nexus.job.ativo=${NEXUS_JOB_ATIVO:true}
app.nexus.job.intervalo-ms=3600000
app.nexus.job.atraso-inicial-ms=120000
