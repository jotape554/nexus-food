spring.datasource.url=jdbc:h2:mem:nexusfood_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mesmas migrações da produção — o teste falha se entidade e schema divergirem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

jwt.secret=chave-de-teste-nao-usada-em-producao-0123456789012345678901234567890
jwt.expiration-ms=86400000

# Os testes de webhook validam só a assinatura HMAC (não fazem chamada de rede para a Stripe).
stripe.secret-key=sk_test_fake
stripe.webhook-secret=whsec_teste_1234567890abcdef
stripe.price.basico=price_teste_basico
stripe.price.profissional=price_teste_profissional
stripe.price.premium=price_teste_premium

app.frontend-url=http://localhost:5173

# Sem essas duas: o EmailService só simula o envio (loga o link) em vez de mandar de verdade.
sendgrid.api-key=
spring.mail.username=

# Os testes criam muitos pedidos do mesmo "IP"; o limite em si é testado em RateLimitIntegrationTest.
app.rate-limit.pedidos-por-minuto=1000

# Nos testes o job do Nexus é chamado na mão (NexusJob.executar), nunca pelo agendador.
app.nexus.regra-vigente=v1
app.nexus.job.ativo=false
