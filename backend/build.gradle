plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.nexusfood'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'

    // Schema versionado: toda mudança de tabela entra como migração em db/migration.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Versão fixada (em vez de deixar o BOM do Spring Boot escolher): versões antigas do
    // Lombok quebram em JDKs recentes com ExceptionInInitializerError/NoSuchFieldException
    // ao tentar acessar internos do javac que mudaram de uma versão do JDK para outra.
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Serializa entidades JPA com associações "lazy" sem tentar carregar/introspectar
    // o proxy do Hibernate (evita InvalidDefinitionException em ByteBuddyInterceptor).
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

    implementation 'com.stripe:stripe-java:33.4.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Banco em memória só para os testes — não precisa de Postgres rodando para rodar `./gradlew test`.
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// O plugin do Spring Boot gera dois jars em build/libs: o "plain" (sem manifesto
// executável) e o de verdade. Desabilitar o plain evita que scripts de deploy que usam
// um curinga (build/libs/*.jar) peguem o arquivo errado por ordem alfabética.
tasks.named('jar') {
    enabled = false
}
